name: Auto-Update BCR APK
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch, download, and extract APK
        id: fetch_release
        run: |
          RELEASES=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/chenxiaolong/BCR/releases?per_page=20")

          LATEST_RELEASE=$(echo "$RELEASES" | jq -c '[.[] | select(.draft == false)] | first')
          LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')

          if [ -z "$LATEST_TAG" ]; then
            echo "Error: Could not determine a valid upstream release tag!"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "TAG=$LATEST_TAG" >> $GITHUB_ENV

          ZIP_URL=$(echo "$LATEST_RELEASE" | jq -r '(.assets // []) | map(select(.name | endswith(".zip"))) | .[0].browser_download_url // empty')

          if [ -z "$ZIP_URL" ]; then
            echo "Error: No ZIP found in the latest release!"
            exit 1
          fi

          echo "Downloading ZIP from: $ZIP_URL"
          wget -qO bcr-release.zip "$ZIP_URL"

          echo "Extracting ZIP..."
          unzip -q bcr-release.zip -d bcr_temp

          APK_PATH=$(find bcr_temp -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: Could not find an APK inside the extracted ZIP!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          mkdir -p bcr/prebuilts/product/priv-app/bcr/
          mv "$APK_PATH" bcr/prebuilts/product/priv-app/bcr/bcr.apk

          rm -rf bcr-release.zip bcr_temp

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bcr/prebuilts/product/priv-app/bcr/bcr.apk

          if git diff --staged --quiet; then
            echo "No new version found. The APK is already up to date."
          else
            echo "New version found! Committing..."
            git commit -m "Version ${{ env.TAG }}"
            git push
          fi
